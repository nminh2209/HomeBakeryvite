name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Use pinned npm (matches packageManager / local)
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint (core modules)
        run: >
          npx eslint
          src/utils/phone.ts src/utils/dashboardStats.ts src/utils/supplyStock.ts
          src/types/order.ts src/layouts/AppLayout.tsx src/routes.tsx src/App.tsx
          src/pages/ordersColumns.tsx src/pages/Dashboard.tsx
          src/pages/Customers.tsx src/pages/Orders.tsx

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Use pinned npm (matches packageManager / local)
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (login + deep links)
        run: npm run test:e2e -- e2e/auth.spec.ts e2e/app-routes.spec.ts
        env:
          CI: true

      - name: E2E navigation (uses E2E_ADMIN_* secrets; skips if unset)
        run: npm run test:e2e -- e2e/navigation.spec.ts
        env:
          CI: true
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
