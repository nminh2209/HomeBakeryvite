name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (npm 10.9.2 via corepack)
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm --version
          npm ci

      - name: Lint (core modules)
        run: >
          npx eslint
          src/utils/phone.ts src/utils/requireEnv.ts src/utils/dashboardStats.ts
          src/utils/supplyStock.ts src/firebase.ts src/utils/cloudinaryUpload.ts
          src/types/order.ts src/layouts/AppLayout.tsx src/routes.tsx src/App.tsx
          src/pages/ordersColumns.tsx src/pages/Dashboard.tsx
          src/pages/Customers.tsx src/pages/Orders.tsx

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_FOLDER: ${{ secrets.VITE_CLOUDINARY_FOLDER }}

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    # Dev server (Playwright webServer) needs VITE_* — not the same as E2E_ADMIN_* login creds
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
      VITE_CLOUDINARY_FOLDER: ${{ secrets.VITE_CLOUDINARY_FOLDER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (npm 10.9.2 via corepack)
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm --version
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (login + deep links)
        run: npm run test:e2e -- e2e/auth.spec.ts e2e/app-routes.spec.ts
        env:
          CI: true

      - name: E2E navigation (requires E2E_ADMIN_EMAIL + E2E_ADMIN_PASSWORD)
        run: npm run test:e2e -- e2e/navigation.spec.ts
        env:
          CI: true
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
